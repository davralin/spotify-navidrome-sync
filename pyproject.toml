[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-navidrome-sync"
version = "0.1.0"
description = "One-shot Spotify playlist to Navidrome playlist sync job"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28.1",
  "pyyaml>=6.0.2",
  "spotdl>=4.2.11",
]

[project.scripts]
spotify-navidrome-sync = "spotify_navidrome_sync.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pre-commit>=4.2.0",
  "pytest>=8.4.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.12.7",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_navidrome_sync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--timeout=30"
testpaths = ["tests"]
